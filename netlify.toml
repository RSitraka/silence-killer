# Netlify : seule l'application web (dossier web/) est déployée.
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Application d'une seule page : toute URL renvoie index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Le service worker doit toujours être revalidé pour que les mises à jour arrivent.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
